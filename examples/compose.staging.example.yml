services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    ports:
      - "127.0.0.1:15678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Generate a staging key}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_RESTRICT_FILE_ACCESS_TO: /vault;/reports
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
    volumes:
      - n8n_staging:/home/node/.n8n
      - ./demo-vault:/vault:ro
      - ./reports:/reports
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:16333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Generate a staging API key}
    volumes:
      - qdrant_staging:/qdrant/storage
  ollama:
    image: ${OLLAMA_IMAGE:?Choose an official Ollama image}
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_staging:/root/.ollama
volumes:
  n8n_staging:
  qdrant_staging:
  ollama_staging:
